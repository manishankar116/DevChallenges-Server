
# Database
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# File uploads
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:6MB}

# Frontend
app.client.base-url=${CLIENT_BASE_URL}

# Neon object storage
app.neon.storage.endpoint=${NEON_STORAGE_ENDPOINT}
app.neon.storage.region=${NEON_STORAGE_REGION}
app.neon.storage.access-key-id=${NEON_STORAGE_ACCESS_KEY_ID}
app.neon.storage.secret-access-key=${NEON_STORAGE_SECRET_ACCESS_KEY}
app.neon.storage.bucket=${NEON_STORAGE_BUCKET:profiles}

# Google OAuth
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# JWT
security.jwt.secret-key=${JWT_SECRET}

app.cors.allowed-origins=https://devchallenges.in